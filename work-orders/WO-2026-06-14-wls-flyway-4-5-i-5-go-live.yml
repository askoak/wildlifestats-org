# ── Deliverables ───────────────────────────────────────────────────────────
deliverables:

  D1_flip_cron_enabled:
    path: "wildlifestats/_pipeline/flyway/CRON_ENABLED"
    purpose: |
      Change the file's content from "0" to "1". The file is a single byte.
      No newlines, no extra whitespace — the read path is
      `f.read().strip()` so cosmetic differences don't matter, but match
      the existing format for cleanliness.

  D2_swap_workflow_schedule:
    path: ".github/workflows/flyway-cron.yml"
    purpose: |
      Change the cron expression from `'0 4 * * *'` (daily 04:00 UTC) to
      `'0 4 * * 0'` (Sundays 04:00 UTC). This is the weekly cadence locked
      in the 2026-06-11 cadence-clarification INBOX.

      Update the workflow file's top comment block to reflect:
        - Current: "Scheduled daily at 04:00 UTC"
        - New: "Scheduled weekly on Sundays at 04:00 UTC (Tier 1 weekly,
          Tier 2 first-of-month gated inside cron_run)"

      Update the safe-by-construction comment that says
      "...The schedule exists but does nothing until 4.5+i.5" to instead
      say "...4.5+i.5 enabled this on 2026-06-14 (perplexity-architect,
      Mike authorization)."

      Leave `workflow_dispatch: {}` in place for manual triggering.

  D3_tier2_first_of_month_gate:
    path: "wildlifestats/_pipeline/flyway/cron_run.py"
    purpose: |
      Verify or add the Tier-2 first-of-month gating logic INSIDE cron_run
      (since the workflow itself can't easily distinguish "first Sunday of
      month" from "any Sunday"). The cron_run logic should:
        - Always run Tier 1 on a Sunday tick
        - Run Tier 2 only if the current UTC date is between the 1st and
          7th of the month (i.e., the FIRST Sunday of the month)
      If this logic is already in place from a prior PR, no change needed
      — just verify and document in the results YAML. If it's not there,
      ADD it; otherwise the cost math is wrong (Tier 2 would fire weekly,
      not monthly, blowing the $75 cap).

  D4_smoke_test_dispatch:
    path: "post-merge action (not a file deliverable)"
    purpose: |
      Immediately after merge: manually trigger the workflow via
      `gh workflow run flyway-cron.yml` from the engineer's session.
      Watch the first run end-to-end. Confirm:
        - cron_run.py sees CRON_ENABLED="1" and proceeds
        - It executes scrapes for the Tier 1 roster
        - Spend tracker logs the spend
        - If today is not the first Sunday of the month, Tier 2 is
          skipped (logged as "tier2 skipped: not first Sunday")
        - If spend exceeds 90% of monthly cap during the run, kill switch
          flips CRON_ENABLED back to "0"
      Record the smoke-test outcome (run URL, total spend, scrape count,
      any errors) in the results YAML.

      If the smoke test fails (any error, cap breach mid-run, kill switch
      trip, or unexpected behavior): the engineer MUST manually flip
      CRON_ENABLED back to "0" and surface immediately to architect.

  D5_results_yaml:
    path: "work-orders/WO-2026-06-14-wls-flyway-4-5-i-5-go-live-results.yml"
    fields_required:
      - status (success | partial | aborted)
      - cron_enabled_value_before (must equal "0")
      - cron_enabled_value_after (must equal "1")
      - workflow_schedule_before (must equal "0 4 * * *")
      - workflow_schedule_after (must equal "0 4 * * 0")
      - tier2_first_of_month_gate_present (boolean: true)
      - smoke_test_run_url
      - smoke_test_outcome (success | failure)
      - smoke_test_spend_usd
      - smoke_test_actor_runs_count
      - smoke_test_tier2_executed (boolean — only true if today is 1st–7th)
      - kill_switch_status_at_end (must equal "1" if no cap breach; "0" if breach)
      - forbidden_surface_grep_result (must equal "clean")
      - notes_for_architect (any anomalies, smoke-test details, what to watch
        for in the first scheduled tick)

