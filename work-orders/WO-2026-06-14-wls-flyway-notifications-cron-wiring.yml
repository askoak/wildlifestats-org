# ── Deliverables ───────────────────────────────────────────────────────────
deliverables:

  D1_weekly_digest_wiring:
    path: "wildlifestats/_pipeline/flyway/cron_run.py"
    purpose: |
      Add a call to notifications.emit_weekly_digest() inside the cron's
      weekly-tick path. The call:
        - Runs AFTER any scrape + trigger evaluation for the week
        - Reads the canonical artifacts (spend-log.json + the week's
          triggers JSON + the week's signal records)
        - Writes the digest INBOX to docs/handoff/ (the existing INBOX dir
          per notifications.py)
        - Catches exceptions; emit_weekly_digest failure does NOT crash
          the cron — it logs to the cron log + sets a degraded-state flag
          in spend-log.json. Notifications should NEVER take the pipeline
          down.

  D2_per_trigger_alert_wiring:
    path: "wildlifestats/_pipeline/flyway/cron_run.py"
    purpose: |
      For each fired trigger in the current cron tick, call
      notifications.emit_trigger_alert(trigger, signal_record).
      Same catch-and-degrade pattern as D1: alert emission failure is
      logged + flagged but does not crash the pipeline.

  D3_kill_switch_respect:
    path: "wildlifestats/_pipeline/flyway/cron_run.py"
    purpose: |
      Notifications are gated by CRON_ENABLED just like the rest of the
      pipeline. If CRON_ENABLED == "0", no digest is emitted (the entire
      tick short-circuits anyway). If a cap-breach trips the kill switch
      mid-tick, any pending digest/alert emissions for THIS tick are
      cancelled — the kill switch fires INSTEAD of the digest, with a
      clear "kill switch tripped mid-tick" alert INBOX as the only
      emission.

  D4_test_coverage_expansion:
    path: "wildlifestats/_pipeline/flyway/test_cron.py"
    purpose: |
      Add tests for:
        (a) Weekly tick calls emit_weekly_digest exactly once after scrape+triggers
        (b) Per-trigger fires each call emit_trigger_alert exactly once
        (c) Notification failures (mock the module to raise) do NOT crash the cron
        (d) CRON_ENABLED == "0" suppresses all notification emission
        (e) Kill-switch trip mid-tick produces a kill-switch alert and cancels pending emissions
      No network. All fixtures.

  D5_results_yaml:
    path: "wildlifestats-org/work-orders/WO-2026-06-14-wls-flyway-notifications-cron-wiring-results.yml"
    fields_required:
      - status (success | partial | aborted)
      - actual_spend_usd (expected: 0)
      - cron_enabled_value_at_start (must equal "0")
      - cron_enabled_value_at_end (must equal "0" — this WO does NOT flip it)
      - tests_added_count (expected: 5)
      - tests_passing_count (expected: all existing + 5 new, all green)
      - forbidden_surface_grep_result (must equal "clean")
      - notes_for_4_5_i_5_go_live_WO: |
          What Mike-authorized 4.5+i.5 go-live WO needs to do after this lands:
            (a) Flip CRON_ENABLED to "1"
            (b) Change the workflow schedule from manual/dispatch to the
                weekly cron expression (engineer to read current state)
            (c) Smoke-test ONE live tick under the cap

