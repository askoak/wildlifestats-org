context: |
  Step 3 of Wave 1: add Regulations.gov as the comment-and-docket enrichment
  layer on top of Codex A's Federal Register foundation.

  Regulations.gov makes the law-watch page meaningfully useful — staff and the
  public need to see open comment windows + docket context, not just FR
  publication dates.

  Regulations.gov API: https://open.gsa.gov/api/regulationsgov/

  CRITICAL: Regulations.gov requires an API key (free, no rate-limit for
  reasonable use). Mike's API key, if any, is stored in his Credentials vault
  per AIStandingOrders convention. Per the bootstrap protocol, the key is read
  from an env var at runtime (REGULATIONS_GOV_API_KEY), NEVER committed to git.

  The field-mapping note (law-watch-federal-field-mapping-2026-06-15.md §6)
  defines exact Regulations.gov → law_watch mappings. Implement that mapping
  literally — do not invent new fields.

# ─────────────────────────────────────────────────────────────────────────────
prereq_check:
  - Before starting, verify Codex A's WO has merged. Check
    `wildlifestats/_pipeline/law_watch/federal_register.py` exists on origin/main.
  - If it doesn't exist yet: pause and write a draft `regulations_gov.py`
    skeleton that imports from a hypothetical `law_watch.federal_register`
    module; mark it WIP; wait. Do not assume the module layout — read what
    Codex A actually shipped.
  - If REGULATIONS_GOV_API_KEY env var is unset: write the fetch path against
    fixtures only and explicitly document the auth dependency. Do NOT attempt
    to bypass auth.

# ─────────────────────────────────────────────────────────────────────────────
scope:
  step_3_regulations_gov_enrichment:
    objective: |
      Add Regulations.gov as an enrichment layer that supplies docket context
      and comment-window metadata to law_watch records that also appear in
      Federal Register.

    tasks:
      - 3a. Create `wildlifestats/_pipeline/law_watch/regulations_gov.py` next
            to Codex A's federal_register.py (do NOT modify their file).
      - 3b. Implement `fetch_regulations_gov(query: str, since: date) -> list[dict]`:
            - Uses /documents and /dockets endpoints
            - Sends `Api-Key` header with REGULATIONS_GOV_API_KEY env var value
            - Handles pagination (page-size 250 max per the docs)
            - Caches raw responses under
              `wildlifestats/_pipeline/law_watch/_cache/regulations_gov/{YYYY-MM-DD}/{endpoint}-page-{N}.json`
            - Idempotent on cache hit
      - 3c. Implement `normalize_regulations_gov(raw: dict) -> dict`:
            - Maps fields per the federal-field-mapping note §6
            - law_watch_id format: `lawwatch.regulations_gov_api.{top_level_id}`
            - source_system: literal `"regulations_gov_api"`
            - Required fields from the schema must all be populated or set to
              null with a `field_gaps` entry in summary
            - Comment-window logic:
              * `comment_window_open: bool` (true if `commentEndDate` is in the future)
              * `comment_window_end_utc: ISO timestamp` (parsed from API)
              * `docket_id: string`
              * If docket lookup is needed for the docket_id, batch it (don't N+1)
      - 3d. Implement `cross_source_bridge(fr_records, rg_records) -> list[dict]`:
            - Reads Codex A's emitted federal_register.jsonl
            - Reads regulations_gov.jsonl from your own emit step
            - Bridges per the field-mapping note §7 ("Cross-source bridge rules")
            - DOES NOT mutate either input file
            - Emits enriched records to a SEPARATE artifact:
              `wildlifestats/_pipeline/law_watch/_output/law_watch_enriched.jsonl`
            - Each enriched record carries: the base law_watch fields + the
              Regulations.gov enrichment fields + `bridge_provenance` field
              naming the source IDs from both sides
            - Same-source dedupe within Regulations.gov is in scope here
              (de-dup before bridging)
      - 3e. Implement `emit_regulations_gov_records() -> int`:
            - Loops cached raw
            - Normalizes
            - Writes JSONL to `_output/regulations_gov.jsonl`
            - Writes summary at `_output/regulations_gov-summary.json`
      - 3f. Tests in `test_regulations_gov.py`:
            - Fixture: small canned RG API responses (≤5 records)
            - Tests every required field maps correctly
            - Tests comment_window_open evaluates correctly for past + future dates
            - Tests cross_source_bridge matches FR + RG records by document
              number / docket ID (use Codex A's fixtures + your own)
            - Tests pass without network access
      - 3g. Extend the CLI at `wildlifestats/_pipeline/law_watch/run.py` (in a
            backward-compatible way — Codex A wrote subcommands; ADD subcommands,
            don't restructure theirs):
            - `python -m wildlifestats._pipeline.law_watch.run regulations-fetch --since 2026-06-01`
            - `python -m wildlifestats._pipeline.law_watch.run regulations-emit`
            - `python -m wildlifestats._pipeline.law_watch.run bridge`

