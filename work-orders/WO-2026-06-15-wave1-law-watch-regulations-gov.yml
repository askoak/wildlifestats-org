  - Do NOT modify `wildlifestats/_pipeline/sources/master-source-registry.yaml`
    except for the one-line `regulations_gov_api` `status` field update from
    `seeded` → `operational_wave1`.
  - Do NOT touch the rehab_social / wildlife911 surfaces (Claude Code A's lane).
  - Do NOT touch `wildlifestats/_pipeline/flyway/*`, `firm_profile/*`.
  - Do NOT commit any API key. Use env var REGULATIONS_GOV_API_KEY only.
  - Cache files under `_cache/regulations_gov/**` MUST be in `.gitignore`.
  - Fixture files (committed) MUST be lightly redacted if they contain PII
    (commenters' names + addresses). For wildlife law dockets this is rare;
    when it does appear, replace with `[redacted-commenter]`.
  - All CI checks must pass (BRWC content guard, credentials leakage guard,
    _common discipline gates).
  - If Codex A's PR hasn't merged at session start: skeleton your module against
    expected interfaces, mark WIP, do NOT push a real PR until they merge.

