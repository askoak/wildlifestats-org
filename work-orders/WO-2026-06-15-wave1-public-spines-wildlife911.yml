# PR target:        main
# PR title:         "[WLS] feat(wildlife911): wave1 spine — render national directory + state agency contacts"
# Estimated time:   6–8 autonomous hours (one PR per Step 1, Step 4-wildlife911)
# Parent contract:  docs/handoff/wildlifestats-wave1-public-spine-implementation-sequence-2026-06-15.md
# Companion notes:  docs/handoff/wildlifestats-rehab-social-monitor-page-contract-2026-06-15.md
